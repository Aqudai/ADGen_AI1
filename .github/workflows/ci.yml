# Проверка на каждый push и pull request: линтер, форматирование, тесты.
# Тестам не нужны PostgreSQL, Redis и нейросети: база — SQLite в памяти,
# нейросети подменены (см. tests/conftest.py). Медленный тест настоящей модели пропускаем.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Линтер (ruff check)
        run: ruff check .

      - name: Форматирование (ruff format --check)
        run: ruff format --check .

      - name: Тесты (pytest)
        run: pytest -m "not slow"
