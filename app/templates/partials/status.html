<ul class="divide-y divide-slate-100">
  {% for check in checks %}
  <li class="flex items-center justify-between gap-4 py-3">
    <span class="text-sm text-slate-700">{{ check.label }}</span>
    {% if check.ok %}
    <span class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-700 ring-1 ring-emerald-600/20">
      <span class="size-1.5 rounded-full bg-emerald-500"></span>работает
    </span>
    {% else %}
    <span class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-rose-50 px-2.5 py-1 text-xs font-medium text-rose-700 ring-1 ring-rose-600/20">
      <span class="size-1.5 rounded-full bg-rose-500"></span>недоступен
    </span>
    {% endif %}
  </li>
  {% endfor %}
</ul>
