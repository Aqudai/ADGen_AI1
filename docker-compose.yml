# Локальная разработка: docker compose up --build
# Для сервера — docker-compose.prod.yml (см. docs/DEPLOY.md)
services:
  # Веб-приложение FastAPI. При старте применяет миграции базы.
  web:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # В разработке — root: код смонтирован из папки проекта, и root может писать в неё
    # на любой ОС (Windows, macOS, Linux). На сервере контейнер работает от пользователя app.
    user: root
    env_file: .env
    environment:
      # Автоперезагрузка при правке кода (опрос файлов нужен для Docker Desktop на Windows)
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app # код с компьютера сразу виден в контейнере
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Воркер Celery: выполняет фоновые задачи (генерацию баннеров).
  # concurrency=2 — две задачи одновременно; каждый процесс держит модель rembg в памяти (~1 ГБ)
  worker:
    build: .
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=2
    user: root
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data # данные переживают перезапуск контейнера
    ports:
      - "5433:5432" # для DBeaver/pgAdmin; 5433 — чтобы не мешать локальному PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
